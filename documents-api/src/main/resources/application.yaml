server:
  port: 8081

spring:
  application:
    name: documents-api
  mongodb:
    uri: mongodb://admin:admin@localhost:27017/document_pipeline?authSource=admin
    representation:
      uuid: standard
  data:
    mongodb:
      auto-index-creation: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/documents-pipeline

minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket: documents

cloud:
  messages:
    ru:
      error.document.not.found: "Документ не найден"
      error.document.already.exists: "Документ уже существует"
      error.document.replacing.error: "Не удалось заменить документ"
      error.document.deletion.error: "Не удалось удалить документ"
      error.document.downloading.error: "Не удалось получить документ"
      error.document.upload.error: "Не удалось загрузить документ"

